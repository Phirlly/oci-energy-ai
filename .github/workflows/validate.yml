name: Validate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.19'
          enable-cache: false
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync python -m unittest discover -s tests -t . -v
      - run: uv run --no-sync python -m compileall -q energy_ai tools deployment
      - run: uv run --no-sync python -m energy_ai baseline
      - run: uv run --no-sync python -m energy_ai scenario --power-kw 25 --capacity-kwh 100 --target-kw 80
      - run: uv run --no-sync python -m deployment.terraform_bundle --output dist/terraform.zip
      - name: Write and verify Terraform checksum
        working-directory: dist
        run: |
          sha256sum terraform.zip > terraform.zip.sha256
          sha256sum -c terraform.zip.sha256
      - name: Upload Terraform configuration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            dist/terraform.zip
            dist/terraform.zip.sha256
          if-no-files-found: error
          retention-days: 7

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version: ['1.5.7', '1.16.4']
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - if: matrix.version == '1.16.4'
        run: terraform fmt -check -recursive
      - if: matrix.version == '1.16.4'
        run: terraform test -no-color
