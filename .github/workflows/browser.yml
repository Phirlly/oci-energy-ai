name: Build bill review browser

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/**'
      - 'energy_ai/**'
      - 'tests/fixtures/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.19'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - run: uv sync --locked --no-dev
      # Temporary credential-free lock bootstrap; replaced by locked CI after retrieval.
      - run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org
        working-directory: frontend
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
        working-directory: frontend
      - run: npm audit --registry=https://registry.npmjs.org
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Export public lock and browser build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-bootstrap-${{ github.sha }}
          path: |
            frontend/package-lock.json
            frontend/dist
          if-no-files-found: error
          retention-days: 1
