name: Bootstrap OCI foundation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Foundation operation (bucket and GenAI project only)
        type: choice
        options: [apply, destroy]
        default: apply
        required: true
      confirmation:
        description: For destroy, enter the exact DEPLOYMENT_ID
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: oci-energy-ai-foundation
  cancel-in-progress: false

jobs:
  foundation:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: demo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.19'
          enable-cache: false
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync python -m unittest discover -s tests -t . -v
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false
      - run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform validate -no-color
      - name: Run foundation operation
        env:
          DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PASSPHRASE: ${{ secrets.OCI_PRIVATE_KEY_PASSPHRASE }}
          BOOTSTRAP_OPERATION: ${{ inputs.operation }}
          DESTROY_CONFIRMATION: ${{ inputs.confirmation }}
        run: uv run --no-sync python -m deployment.bootstrap "$BOOTSTRAP_OPERATION" --confirm "$DESTROY_CONFIRMATION"
