name: Publish Console installer

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: oci-energy-ai-distribution
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
    with:
      export_runtime: true

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: demo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.19'
          enable-cache: false
      - run: uv sync --locked --no-dev
      - run: uv pip check --python .venv/bin/python
      - name: Require one checked producer artifact
        env:
          RUNTIME_ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
        run: '[[ "$RUNTIME_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Download this run's exact checked image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: dist/runtime
          digest-mismatch: error
      - name: Publish checked public installation assets
        env:
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PASSPHRASE: ${{ secrets.OCI_PRIVATE_KEY_PASSPHRASE }}
        run: uv run --no-sync python -m deployment.publish_console
