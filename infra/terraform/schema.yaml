{
  "title": "OCI Energy AI",
  "description": "Deploy the energy demo in a fresh OCI Resource Manager stack.",
  "schemaVersion": "1.1.0",
  "version": "preview",
  "locale": "en",
  "informationalText": "Creates paid OCI resources: a private VM (1 OCPU, 8 GB RAM, 50 GB boot disk), networking/NAT, HTTPS API Gateway, Vault and a Generative AI project. Use a compartment and region with capacity and access to these services. Your OCI identity must be allowed to provision them and create the runtime dynamic group and policy in the tenancy.",
  "instructions": "After Apply succeeds, installation continues on the VM. Select Open owner setup secret below and follow its retrieval steps. Open Energy demo when ready. Enter the setup_code value in Owner code, choose your Demo password and optionally add OpenAI and Anthropic keys. Save setup, then sign in with that password. Keep credentials out of stack variables. This ZIP is for a fresh stack; it does not convert an existing deployment.",
  "troubleshooting": "If installation exhausts its attempts, inspect the VM's installer service and fix the reported prerequisite before increasing Installer retry generation. Keep the saved host image, domain and location. Destroy removes this demo's resources and public history; Vault deletion follows OCI waiting periods. The Resource Manager stack record remains.",
  "variableGroups": [
    {
      "title": "Deployment",
      "variables": [
        "${deployment_id}",
        "${compartment_ocid}",
        "${availability_domain}",
        "${show_advanced_options}"
      ]
    },
    {
      "title": "AI models (optional)",
      "visible": "${show_advanced_options}",
      "variables": [
        "${oci_model}",
        "${openai_model}",
        "${anthropic_model}"
      ]
    },
    {
      "title": "Installation recovery",
      "visible": "${show_advanced_options}",
      "variables": [
        "${install_generation}"
      ]
    },
    {
      "title": "Supplied by OCI and this package",
      "visible": false,
      "variables": [
        "${tenancy_ocid}",
        "${region}",
        "${console_install}",
        "${console_release}",
        "${application}",
        "${instance_shape}",
        "${image_operating_system}",
        "${image_ocid}"
      ]
    }
  ],
  "variables": {
    "deployment_id": {
      "type": "string",
      "title": "Deployment name",
      "description": "Name unique across this tenancy, including other compartments and regions (3–32 lowercase letters, digits or hyphens).",
      "default": "energy-demo",
      "required": true,
      "pattern": "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    },
    "compartment_ocid": {
      "type": "oci:identity:compartment:id",
      "title": "Compartment",
      "description": "Choose a child compartment or the root of the signed-in tenancy.",
      "required": true
    },
    "availability_domain": {
      "type": "oci:identity:availabilitydomain:name",
      "title": "Availability domain",
      "required": true,
      "dependsOn": {
        "compartmentId": "${compartment_ocid}"
      }
    },
    "image_ocid": {
      "type": "string",
      "visible": false,
      "description": "A compatible Oracle Linux 9 platform image is selected automatically and retained for this stack."
    },
    "install_generation": {
      "type": "integer",
      "title": "Installer retry generation",
      "description": "Leave at 0 for initial deployment. Increase only after fixing an exhausted installation.",
      "default": 0,
      "minimum": 0,
      "maximum": 1000000
    },
    "tenancy_ocid": {
      "type": "string",
      "visible": false
    },
    "region": {
      "type": "string",
      "visible": false
    },
    "console_install": {
      "type": "boolean",
      "visible": false,
      "default": true
    },
    "console_release": {
      "type": "object",
      "visible": false,
      "attributes": [
        "console_release_artifact_base",
        "console_release_release",
        "console_release_host_digest",
        "console_release_image_id",
        "console_release_image_sha256",
        "console_release_image_bytes"
      ],
      "title": "Checked public release"
    },
    "application": {
      "type": "object",
      "visible": false,
      "attributes": [
        "application_version",
        "application_tenancy_ocid",
        "application_home_region",
        "application_availability_domain",
        "application_image_ocid"
      ],
      "title": "GitHub application topology"
    },
    "instance_shape": {
      "type": "string",
      "visible": false,
      "default": "VM.Standard.E5.Flex"
    },
    "image_operating_system": {
      "type": "string",
      "visible": false,
      "default": "Oracle Linux"
    },
    "console_release_artifact_base": {
      "type": "string",
      "actualName": "artifact_base",
      "visible": false
    },
    "console_release_release": {
      "type": "string",
      "actualName": "release",
      "visible": false
    },
    "console_release_host_digest": {
      "type": "string",
      "actualName": "host_digest",
      "visible": false
    },
    "console_release_image_id": {
      "type": "string",
      "actualName": "image_id",
      "visible": false
    },
    "console_release_image_sha256": {
      "type": "string",
      "actualName": "image_sha256",
      "visible": false
    },
    "console_release_image_bytes": {
      "type": "integer",
      "actualName": "image_bytes",
      "visible": false
    },
    "application_version": {
      "type": "integer",
      "actualName": "version",
      "visible": false
    },
    "application_tenancy_ocid": {
      "type": "string",
      "actualName": "tenancy_ocid",
      "visible": false
    },
    "application_home_region": {
      "type": "string",
      "actualName": "home_region",
      "visible": false
    },
    "application_availability_domain": {
      "type": "string",
      "actualName": "availability_domain",
      "visible": false
    },
    "application_image_ocid": {
      "type": "string",
      "actualName": "image_ocid",
      "visible": false
    },
    "show_advanced_options": {
      "type": "boolean",
      "title": "Show advanced options",
      "default": false
    },
    "oci_model": {
      "type": "string",
      "title": "OCI model",
      "description": "Keep the default unless you have verified access and compatibility with this demo. This is a model ID, not an API key.",
      "default": "google.gemini-2.5-flash",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
    },
    "openai_model": {
      "type": "string",
      "title": "OpenAI model",
      "description": "Keep the default unless you have verified access and compatibility with this demo. This is a model ID, not an API key.",
      "default": "gpt-4.1-2025-04-14",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
    },
    "anthropic_model": {
      "type": "string",
      "title": "Anthropic model",
      "description": "Keep the default unless you have verified access and compatibility with this demo. This is a model ID, not an API key.",
      "default": "claude-haiku-5-5",
      "pattern": "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
    }
  },
  "outputs": {
    "application_origin": {
      "type": "link",
      "title": "Energy demo",
      "displayText": "Open energy demo"
    },
    "settings_secret_ocid": {
      "type": "ocid",
      "title": "Settings secret OCID",
      "description": "In the deployment region, open Identity & Security > Secret Management, select the deployment compartment and the secret matching this OCID. Under Versions, open CURRENT actions > View Secret Contents, enable decoded Base64 and copy only setup_code into Owner code in the demo."
    },
    "settings_secret_url": {
      "type": "link",
      "title": "Owner setup secret",
      "displayText": "Open owner setup secret",
      "description": "Opens this deployment's settings secret in the correct region. Under Versions, open CURRENT actions > View Secret Contents, enable decoded Base64 and copy only setup_code into Owner code in the demo."
    },
    "instance_ocid": {
      "type": "ocid",
      "title": "Application VM"
    },
    "artifact_bucket_name": {
      "visible": false,
      "type": "string"
    },
    "object_storage_namespace": {
      "visible": false,
      "type": "string"
    },
    "generative_ai_project_ocid": {
      "visible": false,
      "type": "ocid"
    },
    "backend_host": {
      "visible": false,
      "type": "string"
    },
    "vault_ocid": {
      "visible": false,
      "type": "ocid"
    },
    "key_ocid": {
      "visible": false,
      "type": "ocid"
    }
  },
  "primaryOutputButton": "${application_origin}"
}
